  "fish-load": "fish_archive = np.load(DATA/'flocking/fish-pairs-2021.npz')\nfish_trials = {key:fish_archive[key] for key in fish_archive.files}\nfish_dt = 1/40\nassert len(fish_trials)==40\nassert all(a.ndim==3 and a.shape[1:]==(2,2) for a in fish_trials.values())\n\ndef valid_runs(mask, minimum=1):\n    edges = np.diff(np.r_[False, mask, False].astype(int))\n    return [(int(a),int(b)) for a,b in zip(np.flatnonzero(edges==1),np.flatnonzero(edges==-1)) if b-a>=minimum]\n\nfish_summary = pd.DataFrame([{'trial':key,'frames':len(p),'both tracked':int(np.isfinite(p).all(axis=(1,2)).sum())} for key,p in fish_trials.items()])\nfish_summary.head()",
  "kinematics": "def planar_kinematics(positions, dt, window=21):\n    smooth = savgol_filter(positions, window, 3, axis=0)\n    velocity = savgol_filter(positions, window, 3, deriv=1, delta=dt, axis=0)\n    acceleration = savgol_filter(positions, window, 3, deriv=2, delta=dt, axis=0)\n    speed = np.linalg.norm(velocity, axis=-1)\n    direction = velocity / np.maximum(speed[...,None], 1e-12)\n    speeding = np.sum(acceleration*direction, axis=-1)\n    turning = (velocity[...,0]*acceleration[...,1]-velocity[...,1]*acceleration[...,0])/np.maximum(speed**2,1e-12)\n    # A near-stationary velocity has no reliable measured heading.\n    turning=np.where(speed>=5,turning,np.nan)\n    return smooth, velocity, acceleration, speed, speeding, turning\n\nreplays=[]\nfor key in list(fish_trials)[:3]:\n    p=fish_trials[key]; a,b=max(valid_runs(np.isfinite(p).all(axis=(1,2)),minimum=100),key=lambda ab:ab[1]-ab[0])\n    b=min(b,a+2400)\n    raw=p[a:b]; sm,v,acc,speed,speeding,turning=planar_kinematics(raw,fish_dt)\n    keep=np.arange(12,len(raw)-12,4)\n    rows=np.column_stack(((a+keep)*fish_dt,raw[keep].reshape(len(keep),4),v[keep].reshape(len(keep),4),turning[keep]))\n    replays.append({'trial':key,'rows':rows,'dt':0.1,'source_start_frame':a,'position_units':'mm'})\npacket['fish_replays']=replays\n",
  "body-frame": "def body_coordinates(displacement, focal_velocity):\n    e=focal_velocity/np.maximum(np.linalg.norm(focal_velocity,axis=-1,keepdims=True),1e-12)\n    return np.stack((np.sum(displacement*e,axis=-1),-displacement[...,0]*e[...,1]+displacement[...,1]*e[...,0]),axis=-1)\n\ndef wrap_angle(angle):\n    return np.arctan2(np.sin(angle),np.cos(angle))\n\n# Features use the preceding 0.2 s of displacement. The response uses the next 0.2 s.\n# Trial splits therefore do not share frames, and predictors do not use future positions.\nfish_encounters=[]\nhop=8\nfor trial,(key,p) in enumerate(fish_trials.items(),1):\n    t=np.arange(hop,len(p)-hop,4)\n    now=(p[t]-p[t-hop])/(hop*fish_dt)\n    after=(p[t+hop]-p[t])/(hop*fish_dt)\n    for focal in [0,1]:\n        neighbor=1-focal\n        displacement=p[t,neighbor]-p[t,focal]\n        body=body_coordinates(displacement,now[:,focal])\n        speed=np.linalg.norm(now[:,focal],axis=1)\n        partner_speed=np.linalg.norm(now[:,neighbor],axis=1)\n        heading=np.arctan2(now[:,focal,1],now[:,focal,0])\n        future_heading=np.arctan2(after[:,focal,1],after[:,focal,0])\n        delta=wrap_angle(np.arctan2(now[:,neighbor,1],now[:,neighbor,0])-heading)\n        turn=wrap_angle(future_heading-heading)/(hop*fish_dt)\n        speeding=(np.linalg.norm(after[:,focal],axis=1)-speed)/(hop*fish_dt)\n        r=np.linalg.norm(body,axis=1)\n        good=np.isfinite(np.column_stack((body,delta,speed,partner_speed,turn,speeding))).all(axis=1)&(r>5)&(r\u003c180)&(speed>5)&(speed\u003c300)&(partner_speed>5)&(partner_speed\u003c300)\n        for j in np.flatnonzero(good):\n            fish_encounters.append((trial,int(t[j]),focal,body[j,0],body[j,1],r[j],delta[j],speed[j],partner_speed[j],turn[j],speeding[j]))\nenc=np.array(fish_encounters)\nassert len(enc)>1000\nprint(f'{len(enc):,} eligible encounters across {len(np.unique(enc[:,0]))} trials; overlapping observations remain grouped by trial.')",
  "response-map": "def response_map(x,y,values,edges,minimum=20):\n    counts,_,_=np.histogram2d(y,x,bins=(edges,edges))\n    total,_,_=np.histogram2d(y,x,bins=(edges,edges),weights=values)\n    mean=np.divide(total,counts,out=np.full_like(total,np.nan),where=counts>=minimum)\n    return mean,counts\n\nmap_edges=np.linspace(-150,150,26)\nturn_map,map_counts=response_map(enc[:,3],enc[:,4],enc[:,9],map_edges)\nspeed_map,_=response_map(enc[:,3],enc[:,4],enc[:,10],map_edges)\nfig,ax=plt.subplots(1,3,figsize=(12,3.8))\nfor axis,values,label,cm,lim in zip(ax,[turn_map,speed_map,np.log10(np.maximum(map_counts,1))],['Mean turn (rad/s)','Mean speed change (mm/s²)','log₁₀ observation count'],['RdBu_r','RdBu_r','viridis'],[3,150,None]):\n    display_values=values[::-1,:].T\n    if label=='Mean turn (rad/s)': display_values=-display_values\n    artist=axis.imshow(display_values,origin='lower',extent=(-150,150,-150,150),cmap=cm,vmin=-lim if lim else None,vmax=lim,aspect='equal')\n    axis.set(xlabel='Left–right position (mm)',ylabel='Back–front position (mm)');fig.colorbar(artist,ax=axis,shrink=.75,label=label+ (' (right positive)' if label=='Mean turn (rad/s)' else ''))\nplt.tight_layout();plt.show()\npacket['fish_maps']={'edges':map_edges,'turn':turn_map,'speeding':speed_map,'counts':map_counts,'eligible_observations':len(enc),'trials':40,'minimum_observations':20}",
  "interaction-rule": "def interaction_rule(x,y,delta,alignment=1.,attraction=1.,repulsion=1.):\n    r=np.maximum(np.hypot(x,y),1e-9)\n    lateral=y/r\n    turn=alignment*np.sin(delta)+attraction*lateral-repulsion*lateral*np.exp(-(r/35)**2)\n    speeding=40*np.tanh((r-55)/45)*x/r\n    return turn,speeding\n\nsynthetic_x=rng.uniform(-150,150,12000);synthetic_y=rng.uniform(-150,150,12000)\nsynthetic_delta=0.5*np.arctan2(synthetic_y,synthetic_x+170)+rng.normal(0,.25,12000)\nsynthetic_noise=rng.normal(0,.35,12000)\nsynthetic={}\nfor name,weights in [('Heading alignment',(2.,0.,0.)),('Position response',(0.,2.,2.5))]:\n    truth,_=interaction_rule(synthetic_x,synthetic_y,synthetic_delta,*weights)\n    observed=truth+synthetic_noise\n    m,c=response_map(synthetic_x,synthetic_y,observed,map_edges,minimum=5)\n    synthetic[name]={'map':m,'counts':c,'weights':weights}\npacket['synthetic_maps']=synthetic\npacket['synthetic_encounters']=np.column_stack((synthetic_x[:1000],synthetic_y[:1000],synthetic_delta[:1000],synthetic_noise[:1000]))",
  "pair-model": "def pair_model_step(position,heading,speed,time,dt,mode):\n    p=np.asarray(position,float);h=np.asarray(heading,float);s=np.asarray(speed,float)\n    e=np.column_stack((np.cos(h),np.sin(h)))\n    body=body_coordinates((p[0]-p[1])[None,:],(e[1]*s[1])[None,:])[0]\n    delta=wrap_angle(h[0]-h[1])\n    omega_leader=.28*np.sin(.7*time)+.12*np.sin(1.3*time)\n    omega_follower=2.0*np.sin(delta) if mode=='alignment' else 2.0*np.arctan2(body[1],body[0])\n    s_new=np.array([50.,np.clip(s[1]+dt*(.7*(body[0]-55)-1.8*(s[1]-50)),10,100)])\n    h_new=h+dt*np.array([omega_leader,omega_follower])\n    e_new=np.column_stack((np.cos(h_new),np.sin(h_new)))\n    return p+dt*s_new[:,None]*e_new,h_new,s_new\n\npair_histories={}\nfor mode in ['alignment','position']:\n    position=np.array([[55.,0.],[0.,0.]]);heading=np.zeros(2);speed=np.full(2,50.)\n    rows=[];phi=[]\n    for j in range(4000):\n        position,heading,speed=pair_model_step(position,heading,speed,j*.01,.01,mode)\n        if j%10==0:\n            rows.append([j*.01,*position.ravel(),*heading,*speed])\n            phi.append(float(np.hypot(np.cos(heading).mean(),np.sin(heading).mean())))\n    rows=np.array(rows)\n    pair_histories[mode]={'rows':rows,'phi':phi,'mean_phi':float(np.mean(phi))}\npacket['pair_models']=pair_histories\nprint('Mean polarization in the two different follower models:', {k:round(v['mean_phi'],4) for k,v in pair_histories.items()})",
  "triplet-superposition": "def triplet_prediction(pair_responses, coefficient=0.5):\n    return coefficient*np.asarray(pair_responses,float).sum(axis=0)\n\npair_example=np.array([[20.,8.],[-10.,5.]])\nassert np.allclose(triplet_prediction(pair_example),[5.,6.5])\n",
  "informed-heading": "def informed_heading_step(heading,fraction=0.1,preference=1.,alignment=1.,dt=0.01):\n    heading=np.asarray(heading,float)\n    c,s=np.cos(heading).mean(),np.sin(heading).mean()\n    informed=np.arange(len(heading))\u003cround(fraction*len(heading))\n    rate=alignment*(s*np.cos(heading)-c*np.sin(heading))-informed*preference*np.sin(heading)\n    return heading+dt*rate\n\nheading_start=0.8+0.35*np.sin(np.arange(40)*2.4)\nfig,ax=plt.subplots()\nfor frac,color in zip([0.,.05,.2,1.],['#aaa18e','#67b7dc','#f2b33d','#79be9e']):\n    h=heading_start.copy();means=[]\n    for j in range(2001):\n        means.append(np.arctan2(np.sin(h).mean(),np.cos(h).mean()))\n        h=informed_heading_step(h,frac)\n    ax.plot(np.arange(2001)*.01,means,color=color,label=f'{100*frac:g}% informed')\nax.set(xlabel='Model time',ylabel='Mean heading (rad)');ax.legend();plt.tight_layout();plt.show()\n",
  "collective-sensing": "def light_field(x,y,time):\n    cx,cy=15*np.sin(time/35),10*np.cos(time/40)\n    return 1-0.9*np.exp(-((np.asarray(x)-cx)**2+(np.asarray(y)-cy)**2)/(2*22**2))\n\ndef sensing_step(state,time,dt=.02,separation=12.,gain=4.):\n    x,y,heading=state\n    nx,ny=-np.sin(heading),np.cos(heading)\n    vl=2+gain*light_field(x+separation*nx/2,y+separation*ny/2,time)\n    vr=2+gain*light_field(x-separation*nx/2,y-separation*ny/2,time)\n    speed=(vl+vr)/2\n    return np.array([x+dt*speed*np.cos(heading),y+dt*speed*np.sin(heading),heading+dt*(vr-vl)/separation])\n\nfig,ax=plt.subplots()\nfor gain,color in [(0.,COLORS['muted']),(4.,COLORS['amber'])]:\n    state=np.array([-55.,-10.,.4]);path=[]\n    for j in range(1751):\n        path.append(state.copy());state=sensing_step(state,j*.02,gain=gain)\n    path=np.asarray(path);ax.plot(path[:,0],path[:,1],color=color,label=f'Speed response {gain:g}')\nax.set(xlabel='x (model length)',ylabel='y (model length)',aspect='equal');ax.legend();plt.tight_layout();plt.show()\n",
  "network-modes": "from scipy.linalg import expm\n\ndef ring_laplacian(size=24):\n    identity=np.eye(size)\n    return 2*identity-np.roll(identity,1,axis=0)-np.roll(identity,-1,axis=0)\n\ndef ring_kernel(size=24,rate=1.,interval=.5):\n    modes=np.arange(size);lam=4*np.sin(np.pi*modes/size)**2\n    return np.array([np.mean(np.exp(-rate*lam*interval)*np.cos(2*np.pi*modes*j/size)) for j in range(size)])\n\ndef network_mode(geometry='ring', size=24, mode=1):\n    \"\"\"Exact eigenmode of a ring, open chain, or open rectangular lattice.\"\"\"\n    rows, cols = 1, size\n    if geometry == 'grid':\n        rows = int(np.sqrt(size))\n        while size % rows:\n            rows -= 1\n        cols = size // rows\n    period = cols if geometry == 'grid' else size\n    i = np.arange(size) % cols if geometry == 'grid' else np.arange(size)\n    if geometry == 'ring':\n        eigenvalue = 2 - 2*np.cos(2*np.pi*mode/period)\n        values = np.cos(2*np.pi*mode*i/period)\n    else:\n        eigenvalue = 2 - 2*np.cos(np.pi*mode/period)\n        values = np.cos(np.pi*mode*(i + .5)/period)\n    return rows, cols, eigenvalue, values\n\nlap=ring_laplacian();eigenvalues,eigenvectors=np.linalg.eigh(lap)\nassert np.allclose(lap.sum(axis=1),0)\nassert np.allclose(ring_kernel(),expm(-.5*lap)[:,0],atol=1e-14)\nfig,ax=plt.subplots(1,2,figsize=(11,4))\ntimes=np.linspace(0,12,241)\nfor mode,color in [(1,COLORS['blue']),(4,COLORS['amber']),(8,COLORS['green'])]:\n    lam=4*np.sin(np.pi*mode/24)**2\n    ax[0].plot(times,np.exp(-lam*times),color=color,label=f'Mode {mode}')\nfor interval,color in [(.05,COLORS['blue']),(.5,COLORS['amber']),(2.,COLORS['green'])]:\n    distance=np.arange(-8,9);kernel=ring_kernel(interval=interval)\n    ax[1].plot(distance,kernel[distance%24],'o-',color=color,label=f'Interval {interval:g}')\nax[0].set(xlabel='Model time',ylabel='Remaining mode amplitude');ax[1].set(xlabel='Network distance from perturbed node',ylabel='Mean heading response');ax[0].legend();ax[1].legend();plt.tight_layout();plt.show()\n",
  "finite-time-inference": "from scipy.optimize import minimize_scalar\n\ndef modal_transition(eigenvalues,rate,noise,interval):\n    eigenvalues=np.asarray(eigenvalues,float)\n    decay=np.exp(-rate*eigenvalues*interval)\n    variance=noise*(-np.expm1(-2*rate*eigenvalues*interval))/(rate*eigenvalues)\n    return decay,variance\n\npositive=eigenvalues[1:];true_rate=1.3;noise_strength=.025;sample_interval=.7\nlocal_rng=np.random.default_rng(151516)\ndecay,variance=modal_transition(positive,true_rate,noise_strength,sample_interval)\ny=local_rng.normal(size=(2501,len(positive)))*np.sqrt(noise_strength/(true_rate*positive))\nfor t in range(2500):y[t+1]=decay*y[t]+local_rng.normal(size=len(positive))*np.sqrt(variance)\ndef transition_nll(rate):\n    decay,variance=modal_transition(positive,rate,noise_strength,sample_interval)\n    residual=y[1:]-decay*y[:-1]\n    return .5*np.sum(np.log(2*np.pi*variance)+residual**2/variance)\nfit=minimize_scalar(transition_nll,bounds=(.2,3.),method='bounded')\nassert abs(fit.x-true_rate)\u003c.08\nfig,ax=plt.subplots();rates=np.linspace(.8,1.8,101);loss=np.array([transition_nll(v) for v in rates]);ax.plot(rates,loss-loss.min(),color=COLORS['amber']);ax.axvline(true_rate,color=COLORS['blue'],label='Generating rate');ax.set(xlabel='Alignment rate (inverse model time)',ylabel=r'$-\\log L+\\log L_{\\max}$');ax.legend();plt.tight_layout();plt.show()\nprint(f'Generating rate {true_rate:.3f}; inferred rate {fit.x:.3f}')\n",
  "propagation-step": "def propagation_step(angle,rate,dt,dx,model='wave',diffusivity=1.,c=2.,damping=.3):\n    lap=(np.roll(angle,-1)-2*angle+np.roll(angle,1))/dx**2\n    if model=='diffusion':\n        return angle+dt*diffusivity*lap,np.zeros_like(rate)\n    next_rate=(rate+dt*c*c*lap)/(1+damping*dt)\n    return angle+dt*next_rate,next_rate\n\nwave_x=np.arange(160)*.125\nwave_initial=.5*np.exp(-((wave_x-10)/.6)**2)\nwave_histories={}\nfor model in ['diffusion','wave']:\n    angle=wave_initial.copy();rate=np.zeros_like(angle);frames=[]\n    for k in range(1501):\n        if k%10==0:frames.append(angle.copy())\n        angle,rate=propagation_step(angle,rate,.004,.125,model=model)\n    wave_histories[model]=np.array(frames)\nfig,ax=plt.subplots(1,2,figsize=(11,4))\nfor axis,model in zip(ax,['diffusion','wave']):\n    a=axis.imshow(wave_histories[model],origin='lower',aspect='auto',extent=(0,20,0,6),vmin=-.5,vmax=.5,cmap='RdBu_r')\n    axis.set(xlabel='Position x (model length)',ylabel='Model time');fig.colorbar(a,ax=axis,label='Heading perturbation (rad)',shrink=.8)\nplt.tight_layout();plt.show()\npacket['propagation']={'x':wave_x,'initial':wave_initial,'dt':.004,'dx':.125,'histories':wave_histories,'frame_dt':.04}",
  "turn-reach": "def turn_reach(distance, speed, damping):\n    \"\"\"Weak-damping traveling-wave amplitude envelope; distances in model units.\"\"\"\n    return np.exp(-damping*np.asarray(distance)/(2*speed))\n\nassert np.allclose(turn_reach([0, 4, 8], 2, .5), [1, np.exp(-.5), np.exp(-1)])\nassert np.allclose(turn_reach([0, 12], 2, 0), [1, 1])\ndistance = np.linspace(0, 12, 241)\nfig, ax = plt.subplots(figsize=(8, 4))\nfor damping in [.1, .3, .8]:\n    ax.plot(distance, turn_reach(distance, 2, damping), lw=3,\n            label=fr\"$\\gamma_{{\\rm turn}}={damping}$\")\nax.axvline(8, color=\"0.5\", ls=\"--\", label=\"Far side of flock\")\nax.set(xlabel=\"Distance traveled (model units)\", ylabel=\"Remaining amplitude A / A₀\",\n       xlim=(0, 12), ylim=(0, 1.05))\nax.legend()\nplt.tight_layout()\nplt.show()\n",
  "wave-dispersion": "def wave_dispersion(k,speed=2.,damping=.7):\n    root=np.sqrt((speed*np.asarray(k))**2-damping**2/4+0j)\n    return -.5j*damping+root,-.5j*damping-root\n\nk=np.linspace(0,2,401);plus,minus=wave_dispersion(k)\nfig,ax=plt.subplots(1,2,figsize=(11,4))\nfor branch,color in [(plus,COLORS['amber']),(minus,COLORS['blue'])]:\n    ax[0].plot(k,branch.real,color=color);ax[1].plot(k,-branch.imag,color=color)\nax[0].set(xlabel='Wavenumber k',ylabel='Real frequency');ax[1].set(xlabel='Wavenumber k',ylabel='Decay rate');plt.tight_layout();plt.show()\nassert np.all(plus.imag\u003c=1e-12) and np.all(minus.imag\u003c=1e-12)\n",
  "fly-load": "fly_dir=DATA/'flies/dfft-2018'\nrect=loadmat(fly_dir/'figure-03-rectangle-high-occupancies.mat')['occ_rectangle_96flies'].astype(int)\nc_low=loadmat(fly_dir/'figure-03-c-shape-low-occupancies.mat')['occ_C_2flies'].astype(int)\nc_high=loadmat(fly_dir/'figure-03-c-shape-high-occupancies.mat')['occ_C_189flies'].astype(int)\nsquare_low=loadmat(fly_dir/'figure-03-square-low-occupancies.mat')['occ_square_1fly'].astype(int)\nsquare_high=loadmat(fly_dir/'figure-03-square-high-occupancies.mat')['occ_square_125flies'].astype(int)\nareas=json.loads((fly_dir/'physical-bin-areas.json').read_text())['bin_area_cm2']\nassert c_low.shape[1]==c_high.shape[1]==37\nassert np.all(c_low.sum(axis=1)==2) and np.all(c_high.sum(axis=1)==189)\nprint({'rectangle_mean_observed_total':round(float(rect.sum(axis=1).mean()),2),'C_sparse_total':2,'C_crowded_total':189,'bin_areas_cm2':areas})",
  "independent-counts": "from scipy.stats import binom,poisson\nN_reference=65\nindependent_n=np.arange(18)\nq_reference=float(rect.mean(axis=0).max()/N_reference)\npacket['independent_counts']={'N':N_reference,'q':q_reference,'n':independent_n,\n 'binomial':binom.pmf(independent_n,N_reference,q_reference),'poisson':poisson.pmf(independent_n,N_reference*q_reference),\n 'rectangle_variance':rect.var(axis=0,ddof=1)}",
  "count-law": "def count_probabilities(f,V,mu=0.):\n    f=np.asarray(f,float);V=np.atleast_1d(V).astype(float);n=np.arange(len(f))\n    log_weight=-f[None,:]-(V[:,None]-mu)*n-gammaln(n+1)\n    return np.exp(log_weight-logsumexp(log_weight,axis=1,keepdims=True))\n\ndef count_mean(f,V,mu=0.):\n    return count_probabilities(f,V,mu)@np.arange(len(f))\n\nassert np.allclose(count_probabilities(np.zeros(50),[-1,0,1]).sum(axis=1),1)\nassert np.allclose(count_mean(np.zeros(50),[-1,0,1]),np.exp(-np.array([-1,0,1])))",
  "dfft-fit": "def fit_dfft(occupancies):\n    a=np.asarray(occupancies,int);T,B=a.shape;nmax=int(a.max());n=np.arange(nmax+1)\n    histogram=np.stack([np.bincount(a[:,b],minlength=nmax+1) for b in range(B)])\n    mean=a.mean(axis=0)\n    def objective(parameters):\n        f=np.r_[0.,0.,parameters[:nmax-1]];V=parameters[nmax-1:]\n        logw=-f[None,:]-V[:,None]*n-gammaln(n+1)\n        logz=logsumexp(logw,axis=1)\n        p=np.exp(logw-logz[:,None])\n        loss=(T*logz.sum()+(histogram*(f[None,:]+V[:,None]*n+gammaln(n+1))).sum())/(T*B)\n        grad_f=(histogram.sum(axis=0)-T*p.sum(axis=0))[2:]/(T*B)\n        grad_v=(T*mean-T*(p@n))/(T*B)\n        return loss,np.r_[grad_f,grad_v]\n    initial=np.r_[np.zeros(nmax-1),-np.log(np.maximum(mean,1e-8))]\n    opt=minimize(objective,initial,jac=True,method='L-BFGS-B',options={'maxiter':2500,'gtol':1e-9,'ftol':1e-12})\n    if not opt.success: raise RuntimeError(opt.message)\n    return np.r_[0.,0.,opt.x[:nmax-1]],opt.x[nmax-1:],float(opt.fun)\n\nsplit=int(.8*len(rect))\nf_rect,V_rect,train_nll=fit_dfft(rect[:split])\nprob_rect=count_probabilities(f_rect,V_rect)\nobserved_prob=np.stack([np.bincount(rect[:,b],minlength=len(f_rect))/len(rect) for b in range(rect.shape[1])])\nheld=rect[split:]\n# The baseline uses the full Poisson law; DFFT uses its declared measured count support.\nlam=rect[:split].mean(axis=0)\npoisson_log=held*np.log(lam)-lam-gammaln(held+1)\ndfft_log=np.log(np.maximum(prob_rect[np.arange(held.shape[1])[None,:],held],1e-300))\nll_gain=float(np.mean(dfft_log-poisson_log))\nassert np.isfinite(ll_gain)\nprint({'held_out_gain_nats_per_bin_observation':round(ll_gain,4),'training_occupancy_range':[0,len(f_rect)-1]})\nfig,ax=plt.subplots(1,2,figsize=(11,4))\nchosen=np.argsort(rect.mean(axis=0))[[10,25,40]]\nn=np.arange(len(f_rect))\nfor b,c in zip(chosen,[COLORS['blue'],COLORS['amber'],COLORS['green']]):\n    ax[0].plot(n,observed_prob[b],'o',color=c,label=f'Bin {b+1} measured')\n    ax[0].plot(n,prob_rect[b],color=c)\nax[0].set(xlabel='Occupancy n',ylabel='Probability',xticks=n);ax[0].legend(fontsize=9)\nax[1].plot(n,f_rect,'o-',color=COLORS['amber']);ax[1].set(xlabel='Occupancy n',ylabel='Crowding cost fₙ',xticks=n)\nplt.tight_layout();plt.show()",
  "pseudo-free-energy": "logz=logsumexp(-f_rect[None,:]-V_rect[:,None]*n-gammaln(n+1),axis=1)\npseudo=-np.log(np.where(observed_prob>0,observed_prob,np.nan))-gammaln(n+1)\ncollapsed=pseudo-V_rect[:,None]*n-logz[:,None]\nfig,ax=plt.subplots(1,2,figsize=(11,4))\nfor b,c in zip(chosen,[COLORS['blue'],COLORS['amber'],COLORS['green']]):\n    ax[0].plot(n,pseudo[b],'o-',color=c,label=f'Bin {b+1}')\n    ax[1].plot(n,collapsed[b],'o',color=c)\nax[1].plot(n,f_rect,color=COLORS['ink'],label='Shared fitted fₙ')\nax[0].set(xlabel='Occupancy n',ylabel='−ln(n! pᵦ(n))');ax[1].set(xlabel='Occupancy n',ylabel='Estimated crowding cost fₙ');ax[0].legend();ax[1].legend();plt.tight_layout();plt.show()",
  "dfft-transfer": "def rescale_cost(f,area_old,area_new):\n    ratio=area_new/area_old\n    n_new=np.arange(int(np.floor((len(f)-1)*ratio))+1)\n    values=CubicSpline(np.arange(len(f))*ratio,np.asarray(f)*ratio)(n_new)\n    # The spline arguments already include both area rescalings; remove its linear gauge.\n    return values-values[0]-n_new*(values[1]-values[0])\n\ndef infer_preference_from_mean(f,means):\n    return np.array([brentq(lambda V:count_mean(f,[V])[0]-m,-60,60) for m in means])\n\ndef predict_total(f,V,total):\n    mu=brentq(lambda value:count_mean(f,V,value).sum()-total,-60,60)\n    return count_mean(f,V,mu),float(mu)\n\nf_c=rescale_cost(f_rect,areas['rectangle'],areas['c_shape'])\nV_c=infer_preference_from_mean(f_c,c_low.mean(axis=0))\npred_c,mu_c=predict_total(f_c,V_c,189)\nnaive_c=189*c_low.mean(axis=0)/c_low.sum(axis=1).mean()\nobs_c=c_high.mean(axis=0)\nblocks=np.array_split(c_high,8)\nsem_c=np.std([b.mean(axis=0) for b in blocks],axis=0,ddof=1)/np.sqrt(8)\nrmse_naive=float(np.sqrt(np.mean((naive_c-obs_c)**2)))\nrmse_dfft=float(np.sqrt(np.mean((pred_c-obs_c)**2)))\nassert np.isclose(pred_c.sum(),189)\nprint({'C_chamber_naive_RMSE_flies_per_bin':round(rmse_naive,3),'C_chamber_DFFT_RMSE':round(rmse_dfft,3),'mu':round(mu_c,3)})\nfig,ax=plt.subplots(1,2,figsize=(11,4))\nmaxn=max(obs_c.max(),naive_c.max())*1.08\nax[0].errorbar(obs_c,naive_c,xerr=sem_c,fmt='o',color=COLORS['blue'],label='Sparse preference only')\nax[0].errorbar(obs_c,pred_c,xerr=sem_c,fmt='o',color=COLORS['amber'],label='Transferred crowding cost')\nax[0].plot([0,maxn],[0,maxn],ls='--',color=COLORS['muted']);ax[0].set(xlabel='Observed mean (flies/bin)',ylabel='Predicted mean (flies/bin)');ax[0].legend(fontsize=9)\nax[1].plot(obs_c,color=COLORS['ink'],label='Measured 189 flies');ax[1].plot(naive_c,color=COLORS['blue'],ls='--',label='Preference only');ax[1].plot(pred_c,color=COLORS['amber'],label='DFFT');ax[1].set(xlabel='Source bin index',ylabel='Mean flies/bin');ax[1].legend(fontsize=9);plt.tight_layout();plt.show()",
  "dfft-square-test": "f_square=rescale_cost(f_rect,areas['rectangle'],areas['square'])\nV_square=infer_preference_from_mean(f_square,square_low.mean(axis=0))\npred_square,mu_square=predict_total(f_square,V_square,125)\nnaive_square=125*square_low.mean(axis=0)\nobs_square=square_high.mean(axis=0)\nsquare_sem=np.std([b.mean(axis=0) for b in np.array_split(square_high,8)],axis=0,ddof=1)/np.sqrt(8)\nsquare_result={'f':f_square,'V':V_square,'mu':mu_square,'predicted':pred_square,'naive':naive_square,\n 'observed':obs_square,'sem':square_sem,'sparse_mean':square_low.mean(axis=0),'nominal_total':125,\n 'mean_detected_total':float(square_high.sum(axis=1).mean()),\n 'rmse_naive':float(np.sqrt(np.mean((naive_square-obs_square)**2))),\n 'rmse_dfft':float(np.sqrt(np.mean((pred_square-obs_square)**2)))}\nassert np.isclose(pred_square.sum(),125)\nprint('Square mean-density comparison:', {k:round(square_result[k],3) for k in ['rmse_naive','rmse_dfft','mean_detected_total']})\nfig,ax=plt.subplots(figsize=(6,4.5))\nax.errorbar(obs_square,naive_square,xerr=square_sem,fmt='o',color=COLORS['blue'],label='Sparse preference only')\nax.errorbar(obs_square,pred_square,xerr=square_sem,fmt='o',color=COLORS['amber'],label='Transferred crowding cost')\nlimit=max(naive_square.max(),obs_square.max())*1.08\nax.plot([0,limit],[0,limit],'--',color=COLORS['muted']);ax.set(xlabel='Observed mean (flies/bin)',ylabel='Predicted mean (flies/bin)');ax.legend(fontsize=10);plt.tight_layout();plt.show()",
  "fly-export": "from scipy.ndimage import zoom\n\ndef small_bin_map(path,variable,max_side=150):\n    a=loadmat(path)[variable]\n    step=max(1,int(np.ceil(max(a.shape)/max_side)))\n    return a[::step,::step].astype(int)\n\npacket['flies']={'f':f_rect,'V_rectangle':V_rect,'observed_probability':observed_prob,'probability':prob_rect,\n                 'pseudo':pseudo,'collapsed':collapsed,'chosen_bins':chosen,'rectangle_means':rect.mean(axis=0),\n                 'rectangle_counts':rect[::25], 'rectangle_mask':small_bin_map(fly_dir/'figure-03-rectangle-bins.mat','bins_f'),\n                 'c_mask':small_bin_map(fly_dir/'figure-03-c-shape-bins.mat','bins'),\n                 'c_sparse_mean':c_low.mean(axis=0),'c_observed':obs_c,'c_naive':naive_c,'c_predicted':pred_c,'c_sem':sem_c,\n                 'c_f':f_c,'c_V':V_c,'c_mu':mu_c,'areas_cm2':areas,'held_out_gain':ll_gain,\n                 'rmse_naive':rmse_naive,'rmse_dfft':rmse_dfft,'count_support':[0,len(f_rect)-1]}\nsquare_result['mask']=small_bin_map(fly_dir/'figure-03-square-bins.mat','bins')\npacket['flies']['square']=square_result",
  "density-functional": "def density_functional(rho,V,area=1.,crowding=1.,rho_ref=1.):\n    \"\"\"Full local density cost, including ideal counting entropy.\"\"\"\n    rho=np.asarray(rho,float);V=np.asarray(V,float)\n    if np.any(rho\u003c0) or rho_ref\u003c=0:\n        raise ValueError('Density must be nonnegative and reference density positive')\n    positive=rho>0\n    entropy=float(area*np.sum(rho[positive]*(np.log(rho[positive]/rho_ref)-1)))\n    environment=float(area*np.dot(V,rho))\n    interaction=float(.5*area*crowding*np.dot(rho,rho))\n    return dict(entropy=entropy,environment=environment,interaction=interaction,\n                total=entropy+environment+interaction)\n\n# The zero-density limit is finite; the derivative recovers the chemical potential.\nassert density_functional([0.],[0.])['total']==0.\nrho_test=np.array([.4,1.2,3.]);V_test=np.array([0.,.5,1.]);area_test=.7;g_test=.3\nfor i in range(len(rho_test)):\n    step=np.zeros_like(rho_test);step[i]=1e-6\n    derivative=(density_functional(rho_test+step,V_test,area_test,g_test)['total']-\n                density_functional(rho_test-step,V_test,area_test,g_test)['total'])/(2e-6*area_test)\n    assert np.isclose(derivative,np.log(rho_test[i])+g_test*rho_test[i]+V_test[i],atol=1e-8)\n\nprofile_x=np.linspace(0,1,48)\nprofile_V=3*profile_x\nprofile_flat=np.full(48,2.)\nprofile_biased=np.exp(-profile_V);profile_biased*=96/profile_biased.sum()\nassert np.isclose(profile_flat.sum(),profile_biased.sum())\npacket['functional']={'x':profile_x,'V':profile_V,'flat':profile_flat,'biased':profile_biased}",
  "density-stationarity": "def density_profile(potential,total=96.,crowding=.5):\n    potential=np.asarray(potential,float)\n    def at_mu(mu):\n        target=mu-potential\n        log_rho=np.minimum(target, np.log(np.maximum(np.abs(target)+1,1)/max(crowding,1e-12))) if crowding>0 else target.copy()\n        for _ in range(60):\n            rho=np.exp(log_rho)\n            log_rho-=(log_rho+crowding*rho-target)/(1+crowding*rho)\n        return np.exp(log_rho)\n    mu=brentq(lambda value:at_mu(value).sum()-total,-30,50)\n    return at_mu(mu),mu\n\nprofile_coordinate=np.linspace(0,1,48);potential=3*profile_coordinate\nfig,ax=plt.subplots()\nfor g,color in [(0.,COLORS['blue']),(.5,COLORS['amber']),(2.,COLORS['green'])]:\n    density,mu=density_profile(potential,crowding=g)\n    assert np.isclose(density.sum(),96.)\n    assert np.allclose(np.log(density)+g*density+potential,mu,atol=1e-10)\n    ax.plot(profile_coordinate,density,color=color,label=f'Crowding coefficient {g:g}')\nax.set(xlabel='Position (model length)',ylabel='Density (model units)');ax.legend();plt.tight_layout();plt.show()\n",

loating,float)):return round(float(value),6) if np.isfinite(value) else None\n    if isinstance(value,np.integer):return int(value)\n    if isinstance(value,dict):return {str(k):json_ready(v) for k,v in value.items()}\n    if isinstance(value,(tuple,list)):return [json_ready(v) for v in value]\n    return value\n\n# Fixtures retain full precision; scientific display/replay payloads use six decimal places.\nfixture_path=OUT/'lecture-15-validation.json'\ndef precise(value):\n    if isinstance(value,np.ndarray):return value.tolist()\n    if isinstance(value,(np.integer,np.floating)):return value.item()\n    if isinstance(value,dict):return {k:precise(v) for k,v in value.items()}\n    if isinstance(value,(tuple,list)):return [precise(v) for v in value]\n    return value\nfixture_path.write_text(json.dumps(precise(fixtures),indent=2,allow_nan=False)+'\\n')\npacket['summary']={'fish_encounters':len(enc),'dfft_heldout_gain':ll_gain,\n                   'c_rmse_naive':rmse_naive,'c_rmse_dfft':rmse_dfft,'square_rmse_naive':square_result['rmse_naive'],'square_rmse_dfft':square_result['rmse_dfft']}\noutput=OUT/'lecture-15-browser-data.js'\noutput.write_text('/* Generated by the executed Lecture 15 Python companion. */\\nwindow.LECTURE15_DATA='+json.dumps(json_ready(packet),separators=(',',':'),allow_nan=False)+';\\n')\nprint(f'Browser dataset written ({output.stat().st_size/1e6:.2f} MB).')\nprint('Normalization, observed totals, normal-acceleration orthogonality and deterministic fixtures checked.')\n# Reproducible provenance for the browser payload; code-cell hash excludes saved outputs.\nimport hashlib\nimport importlib.metadata\nimport nbformat\ncompanion=ROOT/'lectures/lecture-15-animal-interaction-rules.ipynb'\nsource_nb=nbformat.read(companion,4)\ncode_sources='\\n\\n'.join(c.source for c in source_nb.cells if c.cell_type=='code')\ninputs=[DATA/'flocking/fish-pairs-2021.npz',fly_dir/'physical-bin-areas.json']\ninputs+=sorted(fly_dir.glob('*.mat'))\nmanifest={'companion':     "g": 5,
    "text": "<ul><li>Sayin and colleagues manipulated sensory input in wild marching bands in Kenya.</li><li>Blinded animals still moved, but their directions no longer followed the band.</li><li>Removing olfactory input or polarized vision did not produce the same loss of coordination.</li></ul>",

    "g": 5,
    "text": "<ul><li>One real locust walks freely on a motorized ball that keeps it in the center.</li><li>A surrounding screen shows moving, computer-generated locusts.</li><li><b>Independent controls:</b> how many neighbors it sees and how closely their walking directions agree.</li><li><b>Measure:</b> whether the real locust follows the virtual band.</li></ul>",

    "t": "Directional coherence guides marching more strongly than density",
    "g": 5,
    "text": "<ul><li>A sparse virtual band can move coherently. A dense one can move in many directions.</li><li>The focal locust’s marching direction depended strongly on the coherence of the scene, with little additional density dependence across the tested range.</li></ul>",

  {
    "t": "The optomotor response does not explain collective marching",
    "g": 5,
    "text": "<p><b>Sol:</b> raised alone<br><b>Greg:</b> raised crowded</p><ul><li><b>A — Visual motion:</b> both turn with moving dots. Both have the optomotor reflex.</li><li><b>B — Virtual band:</b> Sol walks in different directions; Greg follows the band.</li><li><b>Sol responds in A, but not B:</b> the reflex alone cannot explain marching.</li></ul>",

    "text": "<ul><li>Virtual neighbors moving away from the focal locust produced strong following.</li><li>The animal’s trajectory depends on the bearings of neighbors ahead.</li><li>Coordinated headings can emerge from following these positions.</li></ul>",

    "t": "Locusts choose one target when the alternatives are far apart",

    "text": "<ul><li>With two nearby targets, the locust often travels between them. As the targets separate, trajectories divide toward one or the other.</li><li>A vector average always points between equal targets. A decision process can instead select one.</li></ul>",

    "text": "<ul class=\"take-home\"><li>Increasing density can turn disordered movement into collective marching.</li><li>Contact helps initiate walking; vision guides direction.</li><li>Social experience changes how locusts respond to neighbors.</li><li>Choosing between targets is not the same as averaging them.</li></ul>",

    "t": "A collective turn spreads from bird to bird",
    "g": 6,
    "text": "<ul><li>Three synchronized cameras reconstruct each bird’s trajectory.</li><li>The birds follow similar paths, with small delays between their turns.</li></ul>",

    "text": "<ul><li>Acceleration perpendicular to flight measures how strongly a bird turns.</li><li><span class=\"red\">Red</span> and <span class=\"blue\">blue</span>: two birds in the same flock.</li><li>The time shift between their turning signals gives the <strong>delay</strong>, \\(\\tau_{ij}\\).</li></ul>",

  {
    "t": "A turn travels across the flock at nearly constant speed",
    "text": "<ul><li><strong>Time:</strong> delay from the first bird to turn.</li><li><strong>Distance:</strong> estimated from the number of birds that have turned and the flock density.</li><li>Three flocks: the turn spreads at nearly constant speed.</li></ul><p>Can local alignment explain how a turn spreads?</p>",

  {
    "t": "Local alignment is faster than neighbor exchange",
    "g": 7,
    "text": "<ul><li>In starling flocks, local heading differences relax faster than neighbors change.</li></ul><div class=\"math\">\\[\\tau_{\\rm relax}\\ll\\tau_{\\rm network}\\]</div><ul><li>We can model local alignment using an approximately fixed neighborhood.</li></ul>",
    "view": "",

    "wide": false,
    "photo": false,

      {
        "label": "Mora, T., Walczak, A.M., Del Castello, L., Ginelli, F., Melillo, S., Parisi, L., Viale, M., Cavagna, A., Giardina, I. (2016). Local equilibrium in bird flocks. Nature Physics 12, 1153-1157. doi:10.1038/nphys3846",
        "url": "https://doi.org/10.1038/nphys3846"
      }
    ]
  },
  {
    "t": "Small heading differences make alignment dynamics approximately linear",
    "g": 7,
    "text": "<ul><li>A bird turns toward the headings of its neighbors:</li></ul><div class=\"math\">\\[\\dot\\vartheta_i=J_{\\rm align}\\sum_jw_{ij}\\sin(\\vartheta_j-\\vartheta_i)+\\xi_i\\]</div><ul><li>In a strongly aligned flock, the heading differences are small.</li></ul><div class=\"math\">\\[\\dot{\\delta\\vartheta}_i\\simeq J_{\\rm align}\\sum_jw_{ij}(\\delta\\vartheta_j-\\delta\\vartheta_i)+\\xi_i\\]</div>",
    "view": "",
    "mode": "",
    "code": [
      "network-modes"
    ],
    "fig": "",
    "wide": true,
    "photo": false,
    "video": "",
    "meta": ""
  },
  {
    "t": "Separate the neighbors’ headings from the bird’s own heading",
    "g": 7,
    "text": "<ul><li>\\(\\delta\\vartheta_i\\): bird \\(i\\)’s heading deviation from a common reference direction.</li><li>\\(w_{ij}\\): influence of bird \\(j\\) on bird \\(i\\). Sum over all birds; \\(w_{ii}=0\\).</li></ul><div class=\"math\">\\[\\dot{\\delta\\vartheta}_i=J_{\\rm align}\\sum_j w_{ij}(\\delta\\vartheta_j-\\delta\\vartheta_i)+\\xi_i\\]</div><div class=\"math\">\\[=J_{\\rm align}\\left[\\underbrace{\\sum_jw_{ij}\\delta\\vartheta_j}_{\\text{neighbors}}-\\underbrace{\\left(\\sum_jw_{ij}\\right)\\delta\\vartheta_i}_{\\text{bird }i}\\right]+\\xi_i\\]</div><ul><li>The same alignment rule, with the two contributions written separately.</li></ul>",
    "view": "",
    "mode": "",
    "code": [
      "network-modes"
    ],
    "fig": "",
    "wide": true,
    "photo": false,
    "video": "",
    "meta": ""
  },
  {
    "t": "The Laplacian collects these coefficients into a matrix",
    "g": 7,
    "text": "<ul><li>Three birds in a chain: \\(1\\leftrightarrow2\\leftrightarrow3\\), with unit weight on each link.</li></ul><div class=\"math\">\\[\\begin{pmatrix}\\dot{\\delta\\vartheta}_1\\\\\\dot{\\delta\\vartheta}_2\\\\\\dot{\\delta\\vartheta}_3\\end{pmatrix}=-J_{\\rm align}\\underbrace{\\begin{pmatrix}1&-1&0\\\\-1&2&-1\\\\0&-1&1\\end{pmatrix}}_{\\boldsymbol\\Lambda_{\\rm align}}\\begin{pmatrix}\\delta\\vartheta_1\\\\\\delta\\vartheta_2\\\\\\delta\\vartheta_3\\end{pmatrix}+\\boldsymbol\\xi\\]</div><ul><li>Diagonal: total weight of a bird’s neighbors. Off-diagonal: negative interaction weight.</li><li>Row 2 gives \\(\\dot{\\delta\\vartheta}_2=J_{\\rm align}(\\delta\\vartheta_1-2\\delta\\vartheta_2+\\delta\\vartheta_3)+\\xi_2\\).</li></ul><div class=\"math\">\\[\\dot{\\delta\\boldsymbol\\vartheta}=-J_{\\rm align}\\boldsymbol\\Lambda_{\\rm align}\\delta\\boldsymbol\\vartheta+\\boldsymbol\\xi\\]</div>",
    "view": "",
    "mode": "",
    "code": [
      "network-modes"
    ],

    "wide": true,
    "photo": false,
    "video": "",
    "meta": ""
  },
  {
    "t": "A mode is a heading pattern that keeps its shape as it relaxes",
    "g": 7,
    "text": "<div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px\"><span>Each mode specifies one heading deviation per bird.</span><span>\\(\\boldsymbol\\Lambda_{\\rm align}\\mathbf u_\\alpha=\\lambda_\\alpha\\mathbf u_\\alpha\\)</span></div><p style=\"font-size:21px;color:var(--muted);margin:16px 0\">Dashed: reference heading. Gold: bird heading, \\(\\delta\\boldsymbol\\vartheta=\\epsilon\\mathbf u_\\alpha\\). Here \\(\\epsilon=12^\\circ\\).</p><table style=\"width:100%;border-collapse:collapse;text-align:center;font-size:23px\"><tr style=\"font-size:21px;color:var(--muted)\"><th>Mode</th><th>Birds 1, 2, 3</th><th>Eigenvalue</th><th style=\"text-align:left\">Heading pattern</th></tr><tr><td>\\((1,1,1)\\)</td><td><svg viewBox=\"0 0 270 92\" width=\"270\" height=\"92\" role=\"img\" aria-label=\"Bird headings for mode (1, 1, 1)\"><line x1=\"45\" y1=\"65\" x2=\"45\" y2=\"12\" stroke=\"#b6ad9b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"45\" y1=\"65\" x2=\"35.02023884074755\" y2=\"18.048915164777327\" stroke=\"#f2b33d\" stroke-width=\"4\"/><polygon points=\"35.02023884074755,18.048915164777327 32.41652943607387,29.848097226937988 42.19800544341193,27.76898031876039\" fill=\"#f2b33d\"/><circle cx=\"45\" cy=\"65\" r=\"3\" fill=\"#f1ece2\"/><text x=\"45\" y=\"87\" fill=\"#b6ad9b\" font-size=\"15\" text-anchor=\"middle\">1</text><line x1=\"135\" y1=\"65\" x2=\"135\" y2=\"12\" stroke=\"#b6ad9b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"135\" y1=\"65\" x2=\"125.02023884074755\" y2=\"18.048915164777327\" stroke=\"#f2b33d\" stroke-width=\"4\"/><polygon points=\"125.02023884074755,18.048915164777327 122.41652943607387,29.848097226937988 132.19800544341194,27.76898031876039\" fill=\"#f2b33d\"/><circle cx=\"135\" cy=\"65\" r=\"3\" fill=\"#f1ece2\"/><text x=\"135\" y=\"87\" fill=\"#b6ad9b\" font-size=\"15\" text-anchor=\"middle\">2</text><line x1=\"225\" y1=\"65\" x2=\"225\" y2=\"12\" stroke=\"#b6ad9b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"225\" y1=\"65\" x2=\"215.02023884074754\" y2=\"18.048915164777327\" stroke=\"#f2b33d\" stroke-width=\"4\"/><polygon points=\"215.02023884074754,18.048915164777327 212.41652943607386,29.848097226937988 222.19800544341194,27.76898031876039\" fill=\"#f2b33d\"/><circle cx=\"225\" cy=\"65\" r=\"3\" fill=\"#f1ece2\"/><text x=\"225\" y=\"87\" fill=\"#b6ad9b\" font-size=\"15\" text-anchor=\"middle\">3</text></svg></td><td>\\(0\\)</td><td style=\"text-align:left\">All birds turn together</td></tr><tr><td>\\((1,0,-1)\\)</td><td><svg viewBox=\"0 0 270 92\" width=\"270\" height=\"92\" role=\"img\" aria-label=\"Bird headings for mode (1, 0, -1)\"><line x1=\"45\" y1=\"65\" x2=\"45\" y2=\"12\" stroke=\"#b6ad9b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"45\" y1=\"65\" x2=\"35.02023884074755\" y2=\"18.048915164777327\" stroke=\"#f2b33d\" stroke-width=\"4\"/><polygon points=\"35.02023884074755,18.048915164777327 32.41652943607387,29.848097226937988 42.19800544341193,27.76898031876039\" fill=\"#f2b33d\"/><circle cx=\"45\" cy=\"65\" r=\"3\" fill=\"#f1ece2\"/><text x=\"45\" y=\"87\" fill=\"#b6ad9b\" font-size=\"15\" text-anchor=\"middle\">1</text><line x1=\"135\" y1=\"65\" x2=\"135\" y2=\"12\" stroke=\"#b6ad9b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"135\" y1=\"65\" x2=\"135.0\" y2=\"17.0\" stroke=\"#f2b33d\" stroke-width=\"4\"/><polygon points=\"135.0,17.0 130.0,28.0 140.0,28.0\" fill=\"#f2b33d\"/><circle cx=\"135\" cy=\"65\" r=\"3\" fill=\"#f1ece2\"/><text x=\"135\" y=\"87\" fill=\"#b6ad9b\" font-size=\"15\" text-anchor=\"middle\">2</text><line x1=\"225\" y1=\"65\" x2=\"225\" y2=\"12\" stroke=\"#b6ad9b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"225\" y1=\"65\" x2=\"234.97976115925246\" y2=\"18.048915164777327\" stroke=\"#f2b33d\" stroke-width=\"4\"/><polygon points=\"234.97976115925246,18.048915164777327 227.80199455658806,27.76898031876039 237.58347056392614,29.848097226937988\" fill=\"#f2b33d\"/><circle cx=\"225\" cy=\"65\" r=\"3\" fill=\"#f1ece2\"/><text x=\"225\" y=\"87\" fill=\"#b6ad9b\" font-size=\"15\" text-anchor=\"middle\">3</text></svg></td><td>\\(1\\)</td><td style=\"text-align:left\">Heading changes across the chain</td></tr><tr><td>\\((1,-2,1)\\)</td><td><svg viewBox=\"0 0 270 92\" width=\"270\" height=\"92\" role=\"img\" aria-label=\"Bird headings for mode (1, -2, 1)\"><line x1=\"45\" y1=\"65\" x2=\"45\" y2=\"12\" stroke=\"#b6ad9b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"45\" y1=\"65\" x2=\"35.02023884074755\" y2=\"18.048915164777327\" stroke=\"#f2b33d\" stroke-width=\"4\"/><polygon points=\"35.02023884074755,18.048915164777327 32.41652943607387,29.848097226937988 42.19800544341193,27.76898031876039\" fill=\"#f2b33d\"/><circle cx=\"45\" cy=\"65\" r=\"3\" fill=\"#f1ece2\"/><text x=\"45\" y=\"87\" fill=\"#b6ad9b\" font-size=\"15\" text-anchor=\"middle\">1</text><line x1=\"135\" y1=\"65\" x2=\"135\" y2=\"12\" stroke=\"#b6ad9b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"135\" y1=\"65\" x2=\"154.52335886763842\" y2=\"21.149818033155157\" stroke=\"#f2b33d\" stroke-width=\"4\"/><polygon points=\"154.52335886763842,21.149818033155157 145.4815285055916,29.165134851844766 154.6169830820176,33.23250128260277\" fill=\"#f2b33d\"/><circle cx=\"135\" cy=\"65\" r=\"3\" fill=\"#f1ece2\"/><text x=\"135\" y=\"87\" fill=\"#b6ad9b\" font-size=\"15\" text-anchor=\"middle\">2</text><line x1=\"225\" y1=\"65\" x2=\"225\" y2=\"12\" stroke=\"#b6ad9b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"225\" y1=\"65\" x2=\"215.02023884074754\" y2=\"18.048915164777327\" stroke=\"#f2b33d\" stroke-width=\"4\"/><polygon points=\"215.02023884074754,18.048915164777327 212.41652943607386,29.848097226937988 222.19800544341194,27.76898031876039\" fill=\"#f2b33d\"/><circle cx=\"225\" cy=\"65\" r=\"3\" fill=\"#f1ece2\"/><text x=\"225\" y=\"87\" fill=\"#b6ad9b\" font-size=\"15\" text-anchor=\"middle\">3</text></svg></td><td>\\(3\\)</td><td style=\"text-align:left\">Middle bird opposes both neighbors</td></tr></table><ul style=\"margin-top:12px\"><li>Uniform rotation creates no disagreement, so alignment does not restore it.</li><li>These three modes can be combined to describe any small heading perturbation.</li></ul>",
    "view": "",
    "mode": "",
    "code": [
      "network-modes"

  {
    "t": "Each mode reduces the coupled equations to one decay equation",
    "g": 7,
    "text": "<ul><li>Follow one mode: \\(\\delta\\boldsymbol\\vartheta(t)=c_\\alpha(t)\\mathbf u_\\alpha\\). Set noise to zero to calculate its relaxation.</li></ul><div class=\"math\">\\[\\dot c_\\alpha\\mathbf u_\\alpha=-J_{\\rm align}c_\\alpha\\boldsymbol\\Lambda_{\\rm align}\\mathbf u_\\alpha=-J_{\\rm align}\\lambda_\\alpha c_\\alpha\\mathbf u_\\alpha\\]</div><div class=\"math\">\\[\\dot c_\\alpha=-J_{\\rm align}\\lambda_\\alpha c_\\alpha\\quad\\Longrightarrow\\quad c_\\alpha(t)=c_\\alpha(0)e^{-J_{\\rm align}\\lambda_\\alpha t}\\]</div><div class=\"math\">\\[\\tau_\\alpha=\\frac{1}{J_{\\rm align}\\lambda_\\alpha}\\qquad(\\lambda_\\alpha>0)\\]</div><ul><li>The middle-against-ends pattern decays three times faster than the gradual pattern in the three-bird example.</li></ul>",
    "view": "",
    "mode": "",
    "code": [
      "network-modes"
    ],
    "fig": "",
    "wide": true,
    "photo": false,
    "video": "",
    "meta": ""
  },
  {
    "t": "Local alignment can be fast while a broad heading pattern relaxes slowly",
    "g": 7,
    "text": "<ul><li>Birds align with their connected neighbors.</li><li>A smooth heading pattern produces small differences between neighbors and relaxes slowly.</li><li>A rapidly varying pattern produces larger differences and relaxes faster.</li></ul><div class=\"math\">\\[\\text{Decay rate}=J_{\\rm align}\\lambda_\\alpha\\]</div><ul><li>Local relaxation and relaxation across the whole flock are different time scales.</li></ul>",
    "view": "network",
    "mode": "modes",
    "code": [
      "network-modes"
    ],
    "fig": "",
    "wide": false,
    "photo": false,
    "video": "",
    "meta": ""
  },
  {
    "t": "Bird positions define a candidate interaction network",
    "text": "<ul><li>Track each bird’s position and heading in successive frames.</li><li>Rank each neighbor by distance: \\(k_{ij}=1\\) is bird \\(i\\)’s nearest neighbor.</li></ul><div class=\"math\">\\[w_{ij}=e^{-k_{ij}/n_c}\\]</div><ul><li>\\(n_c\\) sets how quickly influence decreases with neighbor rank.</li><li>For each candidate \\(n_c\\), the measured positions give an interaction matrix \\(\\boldsymbol\\Lambda_{\\rm align}\\).</li></ul>",
    "g": 7,
    "fig": "",
    "view": "",
    "mode": "",
    "code": [
      "finite-time-inference"
    ],
    "wide": true,
    "photo": false,
    "video": "",
    "meta": ""
  },
  {
    "t": "Fit the interaction rule to changes between frames",
    "text": "<ul><li>For each candidate network, predict the mean headings at the next frame:</li></ul><div class=\"math\">\\[\\mathbb E[\\delta\\boldsymbol\\vartheta(t+\\Delta t)\\mid\\delta\\boldsymbol\\vartheta(t)]=e^{-J_{\\rm align}\\boldsymbol\\Lambda_{\\rm align}\\Delta t}\\,\\delta\\boldsymbol\\vartheta(t)\\]</div><ul><li>Noise sets the expected scatter around this prediction.</li><li>Fit \\(n_c\\), alignment strength, and noise to make the observed changes most likely.</li><li>For one mode, Euler uses \\(e^{-\\Delta t/\\tau_\\alpha}\\simeq1-\\Delta t/\\tau_\\alpha\\), valid when \\(\\Delta t\\ll\\tau_\\alpha\\).</li></ul>",
    "g": 7,
    "fig": "",
    "view": "",
    "mode": "",
    "code": [
      "finite-time-inference"
    ],
    "wide": true,
    "photo": false,
    "video": "",
    "meta": ""
  },
  {
    "t": "This flock aligns over roughly 6–8 neighbors",
    "text": "<ul><li><strong>One starling flock</strong>, analyzed at different intervals between frames.</li><li><strong>Red:</strong> the full relaxation model gives \\(n_c\\approx3–4\\), equivalent to roughly <strong>6–8 equally weighted neighbors</strong>.</li><li><strong>Green:</strong> the short-time approximation overestimates the range when frames are skipped.</li></ul><p class=\"small\" style=\"margin-top:24px\">\\(n_c\\) measures how quickly influence fades with neighbor rank.</p>",
    "g": 7,
    "fig": "../media/collective-motion/mora-natural-flock-sampling.png",
    "view": "",
    "mode": "",
    "code": [],
    "wide": false,
    "photo": false,
    "video": "",
    "meta": ""
  },
  {
    "t": "Our model predicts diffusion, but starling turns travel as waves",
    "text": "<ul><li>The local alignment model predicts <strong>diffusive spreading</strong>:</li></ul><div class=\"math\">\\[\\partial_t\\delta\\vartheta=D_\\vartheta\\partial_x^2\\delta\\vartheta\\]</div><ul><li>Particle diffusion: MSD \\(\\propto t\\), so spread \\(\\propto\\sqrt{t}\\).</li><li>Here the spreading quantity is a <strong>heading disturbance</strong>.</li><li><strong>Starling measurements:</strong> distance grows approximately linearly with time—a <strong>wave</strong>.</li></ul>",
    "g": 8,
    "fig": "../media/collective-motion/attanasi-turn-distance.png",
    "view": "",
    "mode": "",
    "wide": false,
    "code": [
      "propagation-step"
    ],
    "photo": false,
    "video": "",
    "meta": ""
  },
  {
    "t": "A bird’s turning rate persists while its neighbors respond",
    "text": "<ul><li>In the previous model, heading differences set the turning rate immediately.</li><li>Here, neighbors change a bird’s turning rate; damping reduces it.</li></ul><div class=\"math\">\\[\\underbrace{\\partial_t^2\\delta\\vartheta}_{\\text{angular acceleration}}=\\underbrace{c_s^2\\partial_x^2\\delta\\vartheta}_{\\text{response to neighbors}}-\\underbrace{\\gamma_{\\rm turn}\\partial_t\\delta\\vartheta}_{\\text{damping of turning}}\\]</div><ul><li>Without neighbor input, the turning rate decays as \\(e^{-\\gamma_{\\rm turn}t}\\).</li><li>Without damping, a change in heading travels at speed \\(c_s\\) without fading.</li><li>This persistence of turning is <strong>behavioral inertia</strong>.</li></ul>",

    "t": "Density Functional Theory predicts an entire density profile",
    "text": "<p><strong>Density Functional Theory (DFT)</strong> assigns a cost to a density profile and finds the profile that minimizes it at fixed population.</p><div class=\"math\">\\[\\mathcal G_{\\rm occ}[\\rho]=\\int\\!\\left[\\underbrace{\\rho\\!\\left(\\ln\\frac{\\rho}{\\rho_{\\rm ref}}-1\\right)}_{\\text{counting entropy}}+\\underbrace{f_{\\rm loc}(\\rho)}_{\\text{crowding}}+\\underbrace{V_{\\rm env}(\\mathbf x)\\rho}_{\\text{environment}}\\right]d^2x\\]</div><div class=\"density-cards\"><article><h3>Counting entropy</h3><p>The standard ideal-particle term: more arrangements are available when animals spread out.</p></article><article><h3>Crowding</h3><p>\\(f_n\\simeq A_b f_{\\rm loc}(n/A_b)\\)<br>The same bin cost, expressed per unit area.</p></article><article><h3>Environment</h3><p>\\(nV_b\\simeq A_b\\rho V_{\\rm env}\\)<br>The same location cost, expressed per unit area.</p></article></div><p class=\"small\" style=\"margin-top:22px\">A functional takes a whole profile as input. The integral replaces a sum over bins; \\(\\rho_{\\rm ref}\\) is a fixed reference density.</p>",

const Science={
 turnReach(distance,speed,damping){return distance.map(x=>Math.exp(-damping*x/(2*speed)));},
 neighbors(p,focal,count=10){if(count<1||count>=p.length)throw new Error('Neighbor count must be between 1 and N-1.');return p.map((r,i)=>({i,d:i===focal?Infinity:r.reduce((a,x,j)=>a+(x-p[focal][j])**2,0)})).sort((a,b)=>a.d-b.d||a.i-b.i).slice(0,count).map(r=>r.i);},
 relaxation(angle,target,dt,tauRelax){if(tauRelax<=0||dt<0)throw new Error('Relaxation time must be positive and dt nonnegative.');return target+(angle-target)*Math.exp(-dt/tauRelax);},
 tracking(tauRelax=.2,tauNetwork=3,dt=.01){if(tauNetwork<=0||dt<=0)throw new Error('Exchange interval and time step must be positive.');let targets=[0,.35,-.25,.3,-.35,.2,0],steps=Math.round(7*tauNetwork/dt),time=[],angle=[0],target=[];for(let i=0;i<=steps;i++){let t=i*dt;time.push(t);target.push(targets[Math.min(Math.floor(t/tauNetwork+1e-9),6)]);if(i<steps)angle.push(this.relaxation(angle[i],target[i],dt,tauRelax));}return{time,angle,target};},
 norm:a=>Math.hypot(...a),
 order(p,v){let pp=[],vv=[],s=[];for(let i=0;i<v.length;i++){let z=Math.hypot(...v[i]);if(z>1e-9&&v[i].every(Number.isFinite)){pp.push(p[i]);vv.push(v[i]);s.push(z);}}let N=s.length;if(!N)return{phi:NaN,phi_v:NaN,rotation:NaN,count:0};let dim=p[0].length,mean=Array(dim).fill(0),sumv=Array(dim).fill(0),center=Array(dim).fill(0);for(let i=0;i<N;i++)for(let j=0;j<dim;j++){mean[j]+=vv[i][j]/s[i]/N;sumv[j]+=vv[i][j];center[j]+=pp[i][j]/N;}let rot=dim===2?0:[0,0,0];for(let i=0;i<N;i++){let r=pp[i].map((x,j)=>x-center[j]),rr=Math.max(Math.hypot(...r),1e-12),e=vv[i].map(x=>x/s[i]);r=r.map(x=>x/rr);if(dim===2)rot+=(r[0]*e[1]-r[1]*e[0])/N;else{rot[0]+=(r[1]*e[2]-r[2]*e[1])/N;rot[1]+=(r[2]*e[0]-r[0]*e[2])/N;rot[2]+=(r[0]*e[1]-r[1]*e[0])/N;}}return{phi:Math.hypot(...mean),phi_v:Math.hypot(...sumv)/s.reduce((a,b)=>a+b,0),rotation:dim===2?Math.abs(rot):Math.hypot(...rot),count:N};},
 body(d,v){let z=Math.max(Math.hypot(...v),1e-12),e=v.map(x=>x/z);return[d[0]*e[0]+d[1]*e[1],-d[0]*e[1]+d[1]*e[0]];},
 wrap:a=>Math.atan2(Math.sin(a),Math.cos(a)),
 rule(x,y,delta,alignment=1,attraction=1,repulsion=1){let r=Math.max(Math.hypot(x,y),1e-9),l=y/r;return[alignment*Math.sin(delta)+attraction*l-repulsion*l*Math.exp(-((r/35)**2)),40*Math.tanh((r-55)/45)*x/r];},
 probabilities(f,V,mu=0){return V.map(v=>{let lf=0;let lw=f.map((a,n)=>{if(n>1)lf+=Math.log(n);return-a-(v-mu)*n-lf;});let m=Math.max(...lw),w=lw.map(x=>Math.exp(x-m)),z=w.reduce((a,b)=>a+b,0);return w.map(x=>x/z);});},

 let total=189,withCost=true,selected=-1,geometry='C shape';let mode=s.mode;if(mode==='scatter')choice(p,'Geometry',['C shape','Square'],geometry,z=>geometry=z);let showObserved=mode!=='sparse'&&mode!=='area';if(mode==='interactive'){range(p,'Total flies',20,250,1,total,z=>total=z);choice(p,'Model',[['crowding','Transferred crowding'],['independent','Preference only']],'crowding',v=>withCost=v==='crowding');}else if(mode==='naive'||mode==='prediction')choice(p,'Measurement',[['show','Show crowded data'],['hide','Hide crowded data']],'show',v=>showObserved=v==='show');p.playing=false;badge(p,'Crowd density prediction');p.draw=()=>{let f=D.flies,obs=f.c_observed,pred=withCost?Science.total(f.c_f,f.c_V,total).means:f.c_sparse_mean.map(x=>x*total/2),naive=f.c_naive,mapMax=Math.max(20,5*Math.ceil(Math.max(...pred,...obs,...(mode==='naive'?naive:[]))/5));if(mode==='comparison'){let all=[{v:naive,l:'Preference only',c:C.blue},{v:f.c_predicted,l:'With crowding',c:C.green},{v:obs,l:'Measured',c:C.ink}],max=5*Math.ceil(Math.max(...naive,...f.c_predicted,...obs)/5);for(let i=0;i<3;i++){let w=p.w/3;label(ctx,all[i].l,w*(i+.5),28,all[i].c,25,'center');drawBinMask(p,ctx,[i*w+16,48,w-32,p.h-100],f.c_mask,all[i].v,max,-1,'');}let bx=p.w*.36,bw=p.w*.28,by=p.h-27;for(let i=0;i<bw;i++){ctx.fillStyle=heat(i/bw*max,max);ctx.fillRect(bx+i,by,1.5,12);}label(ctx,'0',bx-12,by+12,C.ink,17,'right');label(ctx,String(max),bx+bw+12,by+12,C.ink,17);p.setReadout('<span>Mean flies per bin · common color scale</span><span>Total <b>189</b></span>');}else if(mode==='scatter'){let square=geometry==='Square',a=square?f.square:{observed:obs,naive,predicted:f.c_predicted,sem:f.c_sem,rmse_naive:f.rmse_naive,rmse_dfft:f.rmse_dfft},obsPlot=a.observed,naivePlot=a.naive,predPlot=a.predicted,semPlot=a.sem,limit=square?12:22;let prose=p.host.closest('.slide');if(prose.querySelector('[data-transfer-name]'))prose.querySelector('[data-transfer-name]').textContent=square?'Square chamber (~125 flies)':'C-shaped chamber (189 flies)';if(prose.querySelector('[data-transfer-naive]'))prose.querySelector('[data-transfer-naive]').textContent=fmt(a.rmse_naive);if(prose.querySelector('[data-transfer-dfft]'))prose.querySelector('[data-transfer-dfft]').textContent=fmt(a.rmse_dfft);let q=plot(ctx,[0,44,p.w,p.h-44],[0,limit],[0,limit],'Observed mean (flies/bin)','Predicted mean (flies/bin)',{equal:true,tickSize:17,labelSize:20});line(ctx,[[q.X(0),q.Y(0)],[q.X(limit),q.Y(limit)]],C.muted,1);for(let i=0;i<obsPlot.length;i++){let x=q.X(obsPlot[i]),lo=q.X(obsPlot[i]-semPlot[i]),hi=q.X(obsPlot[i]+semPlot[i]);line(ctx,[[lo,q.Y(naivePlot[i])],[hi,q.Y(naivePlot[i])]],C.blue,1);line(ctx,[[lo,q.Y(predPlot[i])],[hi,q.Y(predPlot[i])]],C.green,1);dot(ctx,x,q.Y(naivePlot[i]),4,C.blue);dot(ctx,x,q.Y(predPlot[i]),4,C.green);}label(ctx,'Preference only',p.w*.28,24,C.blue,20,'center');label(ctx,'With crowding',p.w*.72,24,C.green,20,'center');p.setReadout('');}else if(mode==='area'){let n=f.f.map((_,i)=>i),nc=f.c_f.map((_,i)=>i);chartLines(ctx,[0,0,p.w,p.h],[{x:n,y:f.f,color:C.blue,name:'Rectangle bin',dots:true},{x:nc,y:f.c_f,color:C.amber,name:'C-shaped bin',dots:true}],'Occupancy n','Dimensionless crowding cost');p.setReadout('<span>Area ratio <b>'+fmt(f.areas_cm2.c_shape/f.areas_cm2.rectangle,3)+'</b></span><span>Same local density cost</span>');}else if(mode==='sparse'){
 drawBinMask(p,ctx,[35,15,p.w-160,p.h-65],f.c_mask,f.c_sparse_mean,.2,selected,'Measured mean flies/bin · 0 to 0.2');
 let gx=p.w-65,gy=65,gh=p.h-155,gradient=ctx.createLinearGradient(0,gy,0,gy+gh);gradient.addColorStop(0,C.blue);gradient.addColorStop(1,C.red);ctx.fillStyle=gradient;ctx.fillRect(gx-8,gy,16,gh);arrow(ctx,gx+24,gy,0,gh,C.ink,2);label(ctx,'Cooler',gx,gy-22,C.blue,19,'center');label(ctx,'Warmer',gx,gy+gh+28,C.red,19,'center');
 p.setReadout('<span>37 bins · total <b>2</b> flies</span><span>Temperature increases downward</span>');}else{let series=mode==='naive'?[{v:naive,l:'Preference × 189/2',c:C.blue},{v:showObserved?obs:null,l:showObserved?'Measured 189 flies':'Measurement hidden',c:C.ink}]:[{v:pred,l:withCost?'Transferred crowding':'Preference only',c:C.green},{v:showObserved&&total===189?obs:null,l:showObserved&&total===189?'Measured 189 flies':'No matching measured condition',c:C.ink}];for(let i=0;i<2;i++){let w=p.w/2;label(ctx,series[i].l,w*(i+.5),24,series[i].c,18,'center');if(series[i].v)drawBinMask(p,ctx,[i*w+10,50,w-20,p.h-100],f.c_mask,series[i].v,mapMax,selected,'');else label(ctx,'Prediction only',w*(i+.5),p.h/2,C.muted,20,'center');}let z=mode==='naive'?naive:pred;p.setReadout(`<span>Predicted total <b>${fmt(z.reduce((a,b)=>a+b,0),1)}</b></span><span>Common scale <b>0–${mapMax}</b> flies/bin</span>`);}};
}else if(s.view==='wave'){
 let damping=.3,c=2,mode=s.mode;if(mode!=='diffusion')range(p,'Damping γ',0,4,.1,damping,z=>{damping=z;calculate();});if(mode==='wave'||mode==='spacetime'||mode==='amplitude')range(p,'Wave speed c',1,3,.1,c,z=>{c=z;calculate();});let histories={},angle,rate;function calculate(){for(let model of ['diffusion','wave']){angle=D.propagation.initial.slice();rate=angle.map(()=>0);let frames=[];for(let k=0;k<=1500;k++){if(k%10===0)frames.push(angle.slice());[angle,rate]=Science.propagation(angle,rate,.004,.125,model,1,c,damping);}histories[model]=frames;}p.time=0;p.dirty=true;}calculate();if(mode==='spacetime'||mode==='amplitude')p.playing=false;else transport(p,6,.04);badge(p,'Heading deviation (rad) · dark = 0, bright = +0.5');p.draw=()=>{let k=clamp(Math.floor(p.time/.04+1e-8),0,150),x=D.propagation.x;if(mode==='spacetime'){for(let j=0;j<2;j++){let model=['diffusion','wave'][j],rect=[j*p.w/2+20,0,p.w/2-20,p.h],q=plot(ctx,rect,[-10,10],[0,3],'Position relative to initial turn','Model time',{compact:true});let a=histories[model];for(let t=0;t<75;t++)for(let i=0;i<a[t].length;i++){ctx.fillStyle=diverge(a[t][i],.5);ctx.fillRect(q.X(i*.125-10),q.Y((t+1)*.04),(q.R-q.L)/160+1,(q.B-q.T)/75+1);}label(ctx,model==='wave'?'Damped wave':'Diffusion',(q.L+q.R)/2,q.T-10,C.ink,17,'center');}}else if(mode==='amplitude'){let tt=histories.wave.map((_,i)=>i*.04),ss=['diffusion','wave'].map((m,i)=>({x:tt,y:histories[m].map(a=>Math.max(...a.map(Math.abs))),color:i?C.amber:C.blue,name:i?'Damped wave':'Diffusion'}));chartLines(ctx,[0,0,p.w,p.h],ss,'Model time','Maximum |heading perturbation| (rad)',{ylim:[0,.55]});}else{let mm=mode==='diffusion'?'diffusion':'wave';chartLines(ctx,[0,0,p.w,p.h],[{x,y:D.propagation.initial,color:C.muted,name:'Initial field',dash:true,alpha:.4},{x,y:histories[mm][k],color:mm==='wave'?C.amber:C.blue,name:mm==='wave'?'Damped wave':'Diffusion'}],'Position (model length)','Heading perturbation (rad)',{ylim:[-.15,.6]});}p.setReadout((mode==='spacetime'||mode==='amplitude'?'':'<span>Model time <b>'+fmt(k*.04)+'</b></span>')+(mode==='diffusion'?'<span>D <b>1</b></span>':'<span>γ <b>'+fmt(damping,1)+'</b></span><span>c <b>'+fmt(c,1)+'</b></span>'));};
}else{p.playing=false;p.draw=()=>{};}
return p;}
function drawBinMask(panel,ctx,rect,mask,values,max,selected=-1,legend=''){
 let [x,y,w,h]=rect,rows=mask.length,cols=mask[0].length,scale=Math.min(w/cols,h/rows),ox=x+(w-cols*scale)/2,oy=y+(h-rows*scale)/2;panel.maskRegions??=[];panel.maskRegions=panel.maskRegions.filter(r=>r.x!==x);panel.maskRegions.push({x,ox,oy,scale,rows,cols,mask});for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let id=mask[j][i];if(id>0&&id<=values.length){ctx.fillStyle=heat(values[id-1],max);ctx.fillRect(ox+i*scale,oy+j*scale,scale+.3,scale+.3);if(id===selected+1){let edge=(i===0||j===0||i===cols-1||j===rows-1||mask[j][i-1]!==id||mask[j][i+1]!==id||mask[j-1]?.[i]!==id||mask[j+1]?.[i]!==id);if(edge){ctx.fillStyle=C.ink;ctx.fillRect(ox+i*scale,oy+j*scale,scale+.3,scale+.3);}}}}if(legend)label(ctx,legend,x+w/2,y+h+16,C.muted,16,'center');}
function binAtPointer(p,event){let r=p.canvas.getBoundingClientRect(),x=(event.clientX-r.left)*p.w/r.width,y=(event.clientY-r.top)*p.h/r.height;for(let a of p.maskRegions||[]){let i=Math.floor((x-a.ox)/a.scale),j=Math.floor((y-a.oy)/a.scale);if(i>=0&&i<a.cols&&j>=0&&j<a.rows)return a.mask[j][i];}return 0;}
</script>
<script>
let current=0,activeController=null,controllers=new Map(),lastFrame=0,pythonSources={};
const board=document.getElementById('board');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function build(){
 if(!D)throw new Error('Lecture data missing. Keep the lectures/, data/ and media/ folders together.');
 if(slides.length!==85)throw new Error('Lecture requires 85 slides.');
 pythonSources=JSON.parse(document.getElementById('python-source').textContent);
 for(let i=0;i<slides.length;i++){let s=slides[i],section=document.createElement('section');section.className='slide'+(s.summary?' synthesis':'');section.id='slide-'+String(i+1).padStart(2,'0');section.setAttribute('aria-label',`Slide ${i+1}: ${s.t}`);let visual=s.embed?'<div class="viz"><iframe src="'+s.embed+'" title="Locust virtual-reality experiment" style="width:100%;height:100%;border:0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>':s.fig?'<div class="viz"><a class="paper-panel '+(s.photo?'organism-photo':'')+'" href="'+s.fig+'" target="_blank" rel="noopener" aria-label="Open figure: '+escapeHTML(s.t)+'"><img src="'+s.fig+'" alt="'+escapeHTML(s.t)+'" loading="eager"></a></div>':s.video?'<div class="viz"><div class="video-wrap"><video controls preload="metadata" playsinline aria-label="'+escapeHTML(s.t)+'"><source src="'+s.video+'" type="video/mp4"></video></div><p class="video-meta">'+s.meta+'</p></div>':s.view==='movie'?'<div class="viz"><div class="video-wrap"><video controls preload="metadata" poster="../media/flocking/golden-shiner-poster.jpg" playsinline aria-label="Golden-shiner school changing collective states"><source src="'+(s.opening?'../media/flocking/golden-shiner-opening.mp4':'../media/flocking/golden-shiner-state-switching-from-4s.mp4')+'" type="video/mp4"></video></div><p class="video-meta">150 golden shiners · 16× physical speed</p></div>':s.view?'<div class="viz" data-view="'+s.view+'"></div>':'';
 section.innerHTML=`<div class="eyebrow">${i===0?'BPY567 · October 29, 2026':chapters[s.g]}</div><h2>${s.t}</h2>${s.subtitle ? `<p style="margin:0 0 18px;flex-shrink:0">${escapeHTML(s.subtitle)}</p>` : ''}`+(s.wide?`<div class="wide"><div class="prose">${s.text}</div>${visual}</div>`:`<div class="split"><div class="prose">${s.text}</div>${visual}</div>`)+`<div class="slide-footer"><span class="slide-citations">${(s.citations||[]).map(c=>`<a href="${escapeHTML(c.url)}" target="_blank" rel="noopener">${escapeHTML(c.label)}</a>`).join('<br>')}</span><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span></div>`;board.append(section);}
 let toc=document.getElementById('toc');chapters.forEach((name,g)=>{let d=document.createElement('details'),summary=document.createElement('summary');summary.textContent=String(g+1).padStart(2,'0')+' · '+name;d.append(summary);slides.forEach((s,i)=>{if(s.g===g){let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'  '+s.t;b.dataset.slide=i;b.addEventListener('click',()=>{show(i);document.body.classList.remove('mobile-toc');});d.append(b);}});toc.append(d);});
 current=clamp((Number(location.hash.match(/\d+/)?.[0])||1)-1,0,slides.length-1);show(current,false);resize();
}
function updatePython(){let s=slides[current],el=document.getElementById('python-content');el.innerHTML=s.code.length?s.code.map(tag=>`<h4>${escapeHTML(tag)}</h4><pre><code>${escapeHTML(pythonSources[tag]||'Source unavailable — rebuild the lecture from its companion.')}</code></pre>`).join(''):'<p>Open the companion for the calculations and source links.</p>';}

function typeset(section){if(window.MathJax?.typesetPromise)window.MathJax.startup.promise.then(()=>window.MathJax.typesetPromise([section])).catch(error=>{document.getElementById('boot-error').textContent='Equation rendering: '+error.message;});}
function show(i,writeHash=true){i=clamp(i,0,slides.length-1);for(let v of document.querySelectorAll('video'))v.pause();if(window.MathJax?.typesetClear&&current!==i)window.MathJax.typesetClear([board.children[current]]);for(let section of board.children)section.classList.remove('active');current=i;let section=board.children[i];section.classList.add('active');if(slides[i].opening||slides[i].autoplay){let video=section.querySelector('video');if(video){video.muted=true;video.loop=!!slides[i].opening;video.play().catch(()=>{});}}document.getElementById('progress').textContent=`${String(i+1).padStart(2,'0')} / ${slides.length}`;document.getElementById('previous').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;document.title=`15.${i+1} · ${slides[i].t} · BPY567`;for(let b of document.querySelectorAll('#toc button'))b.setAttribute('aria-current',Number(b.dataset.slide)===i?'true':'false');document.querySelectorAll('#toc details').forEach((d,j)=>d.open=j===slides[i].g);let host=section.querySelector('[data-view]');activeController=null;if(host){if(!controllers.has(i))controllers.set(i,createController(host,slides[i]));activeController=controllers.get(i);activeController.resize();activeController.dirty=true;}updatePython();typeset(section);if(writeHash){try{history.replaceState(null,'','#slide-'+String(i+1).padStart(2,'0'));}catch{location.hash='slide-'+String(i+1).padStart(2,'0');}}document.getElementById('announcement').textContent=`Slide ${i+1} of ${slides.length}. ${slides[i].t}`;}
function resize(){let vp=document.getElementById('viewport'),scale=Math.min(vp.clientWidth/1280,vp.clientHeight/720);board.style.transform=`scale(${scale})`;activeController?.resize();}
function closeDrawers(){document.getElementById('python-drawer').classList.remove('open');}
document.getElementById('previous').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);
document.getElementById('contents').onclick=()=>{if(innerWidth<=850)document.body.classList.toggle('mobile-toc');else document.body.classList.toggle('rail-hidden');resize();};
document.getElementById('python-toggle').onclick=()=>document.getElementById('python-drawer').classList.toggle('open');document.getElementById('python-close').onclick=closeDrawers;
function setPresentation(on){document.body.classList.toggle('presentation',on);document.getElementById('fullscreen').setAttribute('aria-label',on?'Exit fullscreen':'Toggle fullscreen');resize();}
function exitPresentation(){setPresentation(false);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}
document.getElementById('fullscreen').onclick=()=>{if(document.body.classList.contains('presentation'))exitPresentation();else{setPresentation(true);if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)setPresentation(false);});
addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(current+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1);}if(e.key==='Home'){e.preventDefault();show(0);}if(e.key==='End'){e.preventDefault();show(slides.length-1);}if(e.key==='Escape'){closeDrawers();exitPresentation();}if(e.key.toLowerCase()==='p')document.getElementById('python-toggle').click();if(e.key.toLowerCase()==='f')document.getElementById('fullscreen').click();if(e.key===' '&&activeController&&!e.target.matches('button')){e.preventDefault();activeController.controls.querySelector('button')?.click();}});
addEventListener('resize',resize);addEventListener('hashchange',()=>{let i=(Number(location.hash.match(/\d+/)?.[0])||1)-1;if(i!==current)show(i,false);});document.addEventListener('visibilitychange',()=>{lastFrame=0;if(document.hidden)for(let v of document.querySelectorAll('video'))v.pause();});
function frame(t){let dt=lastFrame?Math.min((t-lastFrame)/1000,.05):0;lastFrame=t;if(!document.hidden&&activeController){let p=activeController;p.resize();p.tick?.(dt);if(p.dirty){p.clear();p.draw();p.dirty=false;}}requestAnimationFrame(frame);}
addEventListener('load',()=>{typeset(board.children[current]);resize();});
addEventListener('error',e=>{document.getElementById('boot-error').textContent=e.message||'An asset could not be loaded.';});
try{build();requestAnimationFrame(frame);}catch(error){document.getElementById('boot-error').textContent=error.message;console.error(error);}
</script>
